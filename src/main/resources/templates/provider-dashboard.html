<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Provider</title></head>
<body>
<h2>SERVICE PROVIDER DASHBOARD</h2>
<p>Ова го гледа само SERVICE_PROVIDER</p>

<div th:if="${provider != null}">
    <h3>Моја услуга</h3>
    <p><b>Име:</b> <span th:text="${provider.name}"></span></p>
    <p><b>Опис:</b> <span th:text="${provider.description}"></span></p>
    <p><b>Град:</b> <span th:text="${provider.city.name}"></span></p>
    <p><b>Категорија:</b> <span th:text="${provider.category.name}"></span></p>
    <p><b>Адреса:</b> <span th:text="${provider.address}"></span></p>
    <p><b>Телефон:</b> <span th:text="${provider.phone}"></span></p>

    <form th:action="@{/provider/edit}" method="get" style="display:inline;">
        <button type="submit">Уреди</button>
    </form>
    <form th:action="@{/provider/delete}" method="post" style="display:inline;" 
          onsubmit="return confirm('Дали си сигурен дека сакаш да ја избришеш услугата?');">
        <button type="submit">Избриши</button>
    </form>
</div>

<div th:if="${provider == null}">
    <p>Немаш креирано оглас.</p>
    <p>
        <a th:href="@{/provider/create}">Креирај го твојот оглас</a>
    </p>
</div>

<p><a th:href="@{/}">Home</a></p>
</body>
</html>
