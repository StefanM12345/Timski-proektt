<!doctype html>
<html lang="mk"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <title>Локален пребарувач на услуги</title>

    <style>

        body{
            font-family:Arial;
            margin:0;
            background:#f4f6fb;
        }

        /* HEADER */

        .header{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            color:white;
            padding:20px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .header h1{
            margin:0;
            font-size:24px;
        }

        .user-box{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .username{
            background:rgba(255,255,255,0.2);
            padding:6px 12px;
            border-radius:20px;
        }

        .logout-btn{
            background:white;
            color:#4facfe;
            border:none;
            padding:6px 12px;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        }

        .logout-btn:hover{
            background:#eee;
        }

        /* MAIN CONTAINER */

        .container{
            padding:30px;
            max-width:1200px;
            margin:auto;
        }

        /* SEARCH CARD */

        .search-card{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,0.08);
            margin-bottom:20px;
        }

        form{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            align-items:end;
        }

        label{
            display:grid;
            gap:6px;
            font-size:14px;
        }

        select,input{
            padding:9px;
            border-radius:6px;
            border:1px solid #ccc;
            min-width:200px;
        }

        button{
            padding:10px 16px;
            border:none;
            background:#4facfe;
            color:white;
            border-radius:6px;
            cursor:pointer;
        }

        button:hover{
            background:#3b8de3;
        }

        /* TABLE */

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,0.08);
        }

        th,td{
            padding:12px;
            border-bottom:1px solid #eee;
        }

        th{
            background:#f3f5f9;
            text-align:left;
        }

        tr:hover{
            background:#fafafa;
        }

        /* BADGE */

        .pill{
            background:#eaf4ff;
            color:#4facfe;
            padding:3px 10px;
            border-radius:20px;
            font-size:12px;
            margin-left:6px;
        }

        /* COMMENT BOX */

        .comment-box{
            margin-top:8px;
            display:flex;
            gap:6px;
        }

        .comment-box input{
            flex:1;
        }

        /* EMPTY */

        .empty{
            padding:20px;
            background:white;
            border-radius:10px;
            margin-top:15px;
            text-align:center;
            box-shadow:0 6px 15px rgba(0,0,0,0.05);
        }

        .muted{
            color:#777;
            margin-top:10px;
        }

    </style>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <h1>Локален пребарувач на услуги</h1>

    <div class="user-box">

        <div sec:authorize="isAuthenticated()">

<span class="username">
👤 <span sec:authentication="name"></span>
</span>

            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button class="logout-btn">Logout</button>
            </form>

        </div>

        <div sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}" style="color:white;">Login</a>
        </div>

    </div>

</div>

<!-- MAIN -->

<div class="container">

    <div class="search-card">

        <div class="muted">
            Пребарај услуги по град, категорија или име.
        </div>

        <form method="get" action="/">

            <label>
                Град
                <select name="city">
                    <option value="">-- Сите --</option>

                    <option th:each="c : ${cities}"
                            th:value="${c.name}"
                            th:text="${c.name}"
                            th:selected="${city != null and city == c.name}">
                    </option>

                </select>
            </label>

            <label>
                Категорија
                <select name="category">
                    <option value="">-- Сите --</option>

                    <option th:each="cat : ${categories}"
                            th:value="${cat.name}"
                            th:text="${cat.name}"
                            th:selected="${category != null and category == cat.name}">
                    </option>

                </select>
            </label>

            <label>
                Пребарување
                <input type="text"
                       name="q"
                       placeholder="auto, barber..."
                       th:value="${q}">
            </label>

            <button type="submit">Пребарај</button>

        </form>

    </div>

    <div class="muted">
        Резултати: <b th:text="${#lists.size(providers)}">0</b>
    </div>

    <div th:if="${#lists.isEmpty(providers)}" class="empty">
        Нема резултати.
    </div>

    <table th:if="${!#lists.isEmpty(providers)}">

        <thead>
        <tr>
            <th>Име</th>
            <th>Категорија</th>
            <th>Град</th>
            <th>Адреса</th>
            <th>Телефон</th>
            <th>Опис</th>
            <th>Акции</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="p : ${providers}">

            <td>
                <span th:text="${p.name}"></span>
                <span class="pill" th:text="'#'+${p.id}"></span>
            </td>

            <td th:text="${p.category.name}"></td>
            <td th:text="${p.city.name}"></td>
            <td th:text="${p.address}"></td>
            <td th:text="${p.phone}"></td>
            <td th:text="${p.description}"></td>

            <td>

                <div sec:authorize="hasRole('USER')">

                    <form th:action="@{/apply/{id}(id=${p.id})}" method="post">
                        <button>Пријави се</button>
                    </form>

                </div>

                <div sec:authorize="hasRole('USER')" class="comment-box">

                    <form th:action="@{/comment}" method="post">

                        <input type="hidden" name="providerId" th:value="${p.id}"/>

                        <input type="text"
                               name="text"
                               placeholder="Коментар..."/>

                        <button>💬</button>

                    </form>

                </div>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
