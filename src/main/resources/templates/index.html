<!doctype html>
<html lang="mk"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>НајдиУслуга – Локален пребарувач на услуги</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        :root {
            --primary: #4facfe;
            --primary-dark: #3b8de3;
            --gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8fafc; min-height: 100vh; }
        .navbar-custom { background: var(--gradient) !important; box-shadow: 0 4px 20px rgba(79,172,254,0.3); }
        .navbar-custom .navbar-brand img { height: 45px; }
        .navbar-custom .nav-link { color: rgba(255,255,255,0.95) !important; font-weight: 500; }
        .navbar-custom .nav-link:hover { color: #fff !important; }
        .btn-username { background: rgba(255,255,255,0.25); color: #fff !important; border: none; border-radius: 50px; padding: 8px 16px; }
        .btn-username:hover { background: rgba(255,255,255,0.4); color: #fff !important; }
        .btn-logout { background: #fff; color: var(--primary); font-weight: 600; border-radius: 8px; }
        .btn-logout:hover { background: #f0f9ff; color: var(--primary-dark); }
        .btn-provider { background: rgba(255,255,255,0.9); color: #28a745; font-weight: 600; border-radius: 8px; }
        .btn-provider:hover { background: #fff; color: #218838; }
        .search-card { border: none; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .form-control, .form-select { border-radius: 10px; border: 1px solid #e2e8f0; padding: 10px 14px; }
        .form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,172,254,0.2); }
        .btn-search { background: var(--gradient); border: none; border-radius: 10px; padding: 10px 24px; font-weight: 600; }
        .btn-search:hover { opacity: 0.95; transform: translateY(-1px); }
        .results-table { border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .results-table thead th { background: #f8fafc; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0; padding: 14px 16px; }
        .results-table tbody td { padding: 14px 16px; vertical-align: middle; }
        .results-table tbody tr:hover { background: #f8fafc; }
        .badge-pill { background: #e0f2fe; color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; }
        .provider-card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); transition: transform 0.2s; }
        .provider-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .provider-card .card-body { padding: 1.25rem; }
        @media (max-width: 768px) {
            .navbar-custom .navbar-brand img { height: 36px; }
            .search-card .row > div { margin-bottom: 0.75rem; }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="НајдиУслуга"/>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Мени">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav ms-auto align-items-center gap-2 gap-lg-3">
                <li sec:authorize="isAuthenticated()" class="nav-item">
                    <a th:href="@{/profile}" class="nav-link btn btn-username text-decoration-none d-inline-flex align-items-center gap-2">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name"></span>
                    </a>
                </li>
                <li sec:authorize="!isAuthenticated()" class="nav-item">
                    <a th:href="@{/login}" class="nav-link">Login</a>
                </li>
                <li sec:authorize="hasRole('USER')" class="nav-item">
                    <a th:href="@{/provider-request/new}" class="btn btn-provider btn-sm">Испрати барање до админ</a>
                </li>
                <li sec:authorize="hasRole('ADMIN')" class="nav-item">
                    <a th:href="@{/admin}" class="btn btn-provider btn-sm" style="color:#dc3545;">Барања за давачи</a>
                </li>
                <li sec:authorize="hasRole('SERVICE_PROVIDER')" class="nav-item">
                    <a th:href="@{/provider/create}" class="btn btn-provider btn-sm">
                        <i class="bi bi-plus-circle me-1"></i>Креирај оглас
                    </a>
                </li>
                <li sec:authorize="isAuthenticated()" class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-logout btn-sm">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN -->
<main class="container py-4 py-lg-5">
    <!-- Search Card -->
    <div class="card search-card mb-4">
        <div class="card-body p-4">
            <p class="text-muted mb-4">Пребарај услуги по град, категорија или име. Одбери „Сите во Македонија“ за сите услуги.</p>
            <form method="get" action="/">
                <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label fw-medium">Град</label>
                        <select name="city" class="form-select">
                            <option value="" th:selected="${#strings.isEmpty(city)}">Сите во Македонија</option>
                            <option th:each="c : ${cities}" th:value="${c.name}" th:text="${c.name}" th:selected="${city != null and city == c.name}"></option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label fw-medium">Категорија</label>
                        <select name="category" class="form-select">
                            <option value="" th:selected="${#strings.isEmpty(category)}">Сите категории</option>
                            <option th:each="cat : ${categories}" th:value="${cat.name}" th:text="${cat.name}" th:selected="${category != null and category == cat.name}"></option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <label class="form-label fw-medium">Пребарување</label>
                        <input type="text" name="q" class="form-control" placeholder="auto, barber..." th:value="${q}"/>
                    </div>
                    <div class="col-12 col-md-6 col-lg-2">
                        <button type="submit" class="btn btn-primary btn-search w-100">
                            <i class="bi bi-search me-2"></i>Пребарај
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Results -->
    <p class="text-muted mb-3">
        Резултати: <strong th:text="${#lists.size(providers)}">0</strong> услуги
        <span th:if="${#strings.isEmpty(city) and #strings.isEmpty(category) and #strings.isEmpty(q)}">(сите во Македонија)</span>
    </p>

    <div th:if="${#lists.isEmpty(providers)}" class="card search-card">
        <div class="card-body text-center py-5 text-muted">
            <i class="bi bi-inbox display-4 mb-3"></i>
            <p class="mb-0">Нема резултати.</p>
        </div>
    </div>

    <!-- Desktop: Table -->
    <div class="table-responsive d-none d-lg-block results-table" th:if="${!#lists.isEmpty(providers)}">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>Име</th>
                    <th>Категорија</th>
                    <th>Град</th>
                    <th>Адреса</th>
                    <th>Телефон</th>
                    <th>Опис</th>
                    <th>Акции</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${providers}">
                    <td>
                        <span th:text="${p.name}"></span>
                        <span class="badge badge-pill ms-1" th:text="'#'+${p.id}"></span>
                    </td>
                    <td th:text="${p.category.name}"></td>
                    <td th:text="${p.city.name}"></td>
                    <td th:text="${p.address}"></td>
                    <td th:text="${p.phone}"></td>
                    <td th:text="${p.description}"></td>
                    <td>
                        <div sec:authorize="hasRole('USER')" class="d-flex flex-column gap-2">
                            <form th:action="@{/apply/{id}(id=${p.id})}" method="post" class="mb-0">
                                <button type="submit" class="btn btn-sm btn-outline-primary">Пријави се</button>
                            </form>
                            <form th:action="@{/comment}" method="post" class="d-flex gap-1 mb-0">
                                <input type="hidden" name="providerId" th:value="${p.id}"/>
                                <input type="text" name="text" class="form-control form-control-sm" placeholder="Коментар..."/>
                                <button type="submit" class="btn btn-sm btn-outline-secondary">💬</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Mobile: Cards -->
    <div class="d-lg-none" th:if="${!#lists.isEmpty(providers)}">
        <div class="row g-3">
            <div class="col-12" th:each="p : ${providers}">
                <div class="card provider-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6 class="mb-0">
                                <span th:text="${p.name}"></span>
                                <span class="badge badge-pill ms-1" th:text="'#'+${p.id}"></span>
                            </h6>
                            <span class="badge bg-light text-dark" th:text="${p.category.name}"></span>
                        </div>
                        <p class="text-muted small mb-1"><i class="bi bi-geo-alt me-1"></i><span th:text="${p.city.name}"></span> · <span th:text="${p.address}"></span></p>
                        <p class="text-muted small mb-1"><i class="bi bi-telephone me-1"></i><span th:text="${p.phone}"></span></p>
                        <p class="small mb-2" th:if="${p.description}" th:text="${p.description}"></p>
                        <div sec:authorize="hasRole('USER')" class="d-flex flex-wrap gap-2">
                            <form th:action="@{/apply/{id}(id=${p.id})}" method="post" class="mb-0">
                                <button type="submit" class="btn btn-sm btn-primary">Пријави се</button>
                            </form>
                            <form th:action="@{/comment}" method="post" class="d-flex gap-1 mb-0 flex-grow-1">
                                <input type="hidden" name="providerId" th:value="${p.id}"/>
                                <input type="text" name="text" class="form-control form-control-sm" placeholder="Коментар..."/>
                                <button type="submit" class="btn btn-sm btn-outline-secondary">💬</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
