<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login – НајдиУслуга</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        body{
            margin:0;
            font-family: Arial, sans-serif;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(-45deg,#4facfe,#00f2fe,#43e97b,#38f9d7);
            background-size:400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        /* background animation */
        @keyframes gradientBG{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        .login-container{
            background:white;
            padding:40px;
            border-radius:16px;
            width:100%;
            max-width:360px;
            box-shadow:0 15px 40px rgba(0,0,0,0.25);
            text-align:center;
            animation: fadeIn 1s ease;
        }

        /* form animation */
        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        h2{
            margin-bottom:25px;
        }

        .input-group{
            position:relative;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            border-radius:8px;
            border:1px solid #ccc;
            outline:none;
            font-size:14px;
        }

        /* floating label */
        label{
            position:absolute;
            left:12px;
            top:12px;
            color:#777;
            font-size:14px;
            transition:0.3s;
            background:white;
            padding:0 5px;
        }

        input:focus + label,
        input:not(:placeholder-shown) + label{
            top:-8px;
            font-size:11px;
            color:#4facfe;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#4facfe;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.05);
            background:#3a8ee6;
        }

        .error{
            color:red;
            margin-bottom:10px;
        }

        .success{
            color:green;
            margin-bottom:10px;
        }
        .wrapper{
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:20px;
            min-height:100vh;
        }

        .logoto{
            margin-bottom:20px;
        }

    </style>
</head>

<body>
<div class="wrapper">
<div class="logoto">
    <img th:src="@{/images/logo.png}" alt="НајдиУслуга" height="100">
</div>
<div class="login-container">

    <h2>Login</h2>

    <div th:if="${param.registered}" class="success">
        Успешна регистрација. Најави се.
    </div>

    <div th:if="${param.error}" class="error">
        Грешен username/password
    </div>

    <div th:if="${param.logout}" class="success">
        Одјавен си.
    </div>

    <form method="post" th:action="@{/login}">

        <div class="input-group">
            <input type="text" name="username" placeholder=" " required>
            <label>Username</label>
        </div>

        <div class="input-group">
            <input type="password" name="password" placeholder=" " required>
            <label>Password</label>
        </div>

        <button type="submit">Login</button>

    </form>

    <div style="margin-top:10px; font-size:13px;">
        Немаш акаунт?
        <a th:href="@{/register}" style="color:#4facfe; text-decoration:none;">Регистрирај се</a>
    </div>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
