<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(-45deg,#4facfe,#00f2fe,#43e97b,#38f9d7);
            background-size:400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        .register-container{
            background:white;
            padding:40px;
            border-radius:15px;
            width:340px;
            box-shadow:0 15px 40px rgba(0,0,0,0.25);
            text-align:center;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        h2{
            margin-bottom:20px;
        }

        .input-group{
            position:relative;
            margin-bottom:8px;
        }

        input{
            width:100%;
            padding:12px;
            border-radius:8px;
            border:1px solid #ccc;
            outline:none;
            font-size:14px;
        }

        label{
            position:absolute;
            left:12px;
            top:12px;
            color:#777;
            font-size:14px;
            transition:0.3s;
            background:white;
            padding:0 5px;
        }

        input:focus + label,
        input:not(:placeholder-shown) + label{
            top:-8px;
            font-size:11px;
            color:#4facfe;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#4facfe;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        button:hover{
            transform:scale(1.05);
            background:#3a8ee6;
        }

        .error{
            color:red;
            font-size:13px;
            margin-bottom:4px;
            text-align:left;
        }

        .global-error{
            color:red;
            margin-bottom:10px;
        }

        .wrapper{
            display:flex;
            flex-direction:column;
            align-items:center;
        }

        .logoto{
            margin-bottom:20px;
        }

        .link{
            margin-top:10px;
            font-size:13px;
        }

        .link a{
            color:#4facfe;
            text-decoration:none;
        }

        .link a:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="logoto">
        <img th:src="@{/images/logo.png}" alt="НајдиУслуга" height="100">
    </div>
    <div class="register-container">
        <h2>Регистрација</h2>

        <div th:if="${#fields.hasGlobalErrors()}" class="global-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

        <form th:action="@{/register}" th:object="${registerForm}" method="post">

            <div class="input-group">
                <input type="text" th:field="*{username}" placeholder=" " required>
                <label>Username</label>
            </div>
            <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>

            <div class="input-group">
                <input type="password" th:field="*{password}" placeholder=" " required>
                <label>Password</label>
            </div>
            <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <div class="input-group">
                <input type="password" th:field="*{confirmPassword}" placeholder=" " required>
                <label>Потврди Password</label>
            </div>
            <div class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

            <button type="submit">Регистрирај се</button>
        </form>

        <div class="link">
            Веќе имаш акаунт?
            <a th:href="@{/login}">Најави се</a>
        </div>
    </div>
</div>
</body>
</html>
